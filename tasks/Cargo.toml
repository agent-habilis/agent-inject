[package]
name = "tasks"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
xshell = "0.2"
# Cargo-style status output, shared with the binary by `include!`ing its
# canonical source (`../crates/agent-inject/src/util/output.rs`).
anstyle = "1"
anstream = "0.6"

[lints]
workspace = true
